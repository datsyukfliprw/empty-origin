name: Build print interior
on:
  push:
    paths:
      - 'book1/print/**'
      - 'book1/frozen/**'
      - 'book1/chapters/**'
      - 'book1/WORKING_DRAFT.md'
      - 'layout_sample.jpeg'
      - '.github/workflows/build-print-interior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: book1/print/requirements.txt
      - run: pip install -r book1/print/requirements.txt
      - run: python book1/print/build_print_interior.py
      - run: python book1/print/validate_print_interior.py
      - uses: actions/upload-artifact@v4
        with:
          name: empty-origin-5.5x8.5-print-interior
          path: |
            book1/print/EMPTY_ORIGIN_5.5x8.5_PRINT_INTERIOR.pdf
            book1/print/EMPTY_ORIGIN_5.5x8.5_PRINT_INTERIOR.manifest.json
            book1/print/PRINT_VALIDATION.json
            book1/print/proofs/*.pdf
            book1/print/proofs/contact-*.jpg
            book1/print/proofs/*-opener.png
            book1/print/proofs/body-page.png
            book1/print/proofs/EMPTY_ORIGIN_APERTURE_RING.png
