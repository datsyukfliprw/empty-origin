name: Build Chapter 1 layout proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r book1/print/requirements.txt
      - run: python book1/print/proofs/build_chapter_01_proof.py
      - uses: actions/upload-artifact@v4
        with:
          name: empty-origin-chapter-01-layout-proof
          path: book1/print/proofs/EMPTY_ORIGIN_CHAPTER_01_LAYOUT_PROOF.pdf
